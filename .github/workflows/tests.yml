name: tests

on:
  push:
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline test suite (no external dependencies)
        run: python3 tests/test_specproof.py
